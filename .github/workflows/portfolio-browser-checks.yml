name: Portfolio browser checks

on:
  push:
    branches:
      - main
      - design/random-hours-visual-refresh
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium tests
        run: npx playwright test --project=chromium --project=mobile-chromium
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
